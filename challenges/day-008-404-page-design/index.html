<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 008 - 404 Page Design</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="error-shell">
    <section class="card" aria-labelledby="err-title">
      <p class="code">404</p>
      <h1 id="err-title">Oops — page not found</h1>
      <p>We couldn't find that route, but we built this fallback page to guide you home.</p>

      <form id="searchForm" role="search" aria-label="Search this site">
        <label for="search">Search for what you need</label>
        <div class="search-row">
          <input id="search" name="search" placeholder="Type a topic" />
          <button type="submit">Search</button>
        </div>
      </form>

      <a class="home" href="#">Return home</a>
      <p id="searchStatus" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('searchForm');
    const status = document.getElementById('searchStatus');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const query = document.getElementById('search').value.trim();
      if (!query) {
        status.textContent = 'Try entering a page name or topic to search.';
      } else {
        status.textContent = `Simulated search complete for "${query}". No matches in this fallback path.`;
      }
    });
  </script>
</body>
</html>
