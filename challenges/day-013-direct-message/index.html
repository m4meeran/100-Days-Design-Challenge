<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 013 - Direct Message</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="messenger-shell">
      <aside class="sidebar" aria-label="Conversation list">
        <h1>Direct Message</h1>
        <p class="muted">Choose a conversation and keep chats focused.</p>

        <div class="thread-list" role="list" aria-label="Active conversations">
          <button
            type="button"
            class="thread"
            data-thread="support"
            aria-label="Open customer support thread"
            role="listitem"
            id="thread-support"
          >
            <strong>Customer Support</strong>
            <span>Alex Morgan</span>
            <span class="thread-meta">You: I can help with return policy.</span>
            <time datetime="2026-08-26T13:20">13:20</time>
          </button>

          <button
            type="button"
            class="thread"
            data-thread="friends"
            aria-label="Open project team thread"
            role="listitem"
            id="thread-friends"
          >
            <strong>Project Team</strong>
            <span>Tara, Leo, Mira</span>
            <span class="thread-meta">Mira: Updated mockups are shared.</span>
            <time datetime="2026-08-26T12:47">12:47</time>
          </button>
        </div>
      </aside>

      <section class="chat-panel" aria-live="polite">
        <header class="chat-header">
          <div>
            <h2 id="chat-title">Customer Support</h2>
            <p id="chat-subtitle" class="muted">Direct support chat • business hours</p>
          </div>
          <button type="button" id="status-pill" aria-live="polite">Typing</button>
        </header>

        <div id="message-stream" class="message-stream" aria-label="Message history" tabindex="0"></div>

        <div class="composer" aria-label="Message composer">
          <label class="sr-only" for="message-input">Write message</label>
          <input id="message-input" type="text" placeholder="Type your message" aria-label="Message input" />
          <button type="button" id="quick-action" aria-label="Insert quick reply">+</button>
          <button type="button" id="send-button">Send</button>
        </div>

        <p id="chat-feedback" class="sr-only" role="status" aria-live="assertive"></p>
      </section>
    </main>

    <script>
      const threads = {
        support: {
          title: 'Customer Support',
          subtitle: 'Direct support chat • business hours',
          statusText: 'Typing',
          messages: [
            {
              id: 's1',
              from: 'customer',
              name: 'Alex Morgan',
              text: 'Hi, I received the wrong size in my last order. Could you check?',
              time: '09:42',
              read: true,
            },
            {
              id: 's2',
              from: 'agent',
              name: 'You',
              text: 'Of course—sorry about that. Could you share the order ID?',
              time: '09:44',
              read: true,
            },
            {
              id: 's3',
              from: 'customer',
              name: 'Alex Morgan',
              text: 'Order #LQ-8841. I just need a quick exchange.',
              time: '09:45',
              read: false,
            },
          ],
        },
        friends: {
          title: 'Project Team',
          subtitle: 'Team workspace • design updates',
          statusText: 'Online',
          messages: [
            {
              id: 'f1',
              from: 'teammate',
              name: 'Tara',
              text: 'I reviewed your prototype and left notes in Figma.',
              time: '11:05',
              read: true,
            },
            {
              id: 'f2',
              from: 'agent',
              name: 'You',
              text: 'Great, I will apply the copy updates by today.',
              time: '11:07',
              read: true,
            },
            {
              id: 'f3',
              from: 'teammate',
              name: 'Mira',
              text: 'Updated mockups are shared for final handoff.',
              time: '12:47',
              read: false,
            },
          ],
        },
      };

      const threadButtons = document.querySelectorAll('.thread');
      const stream = document.getElementById('message-stream');
      const title = document.getElementById('chat-title');
      const subtitle = document.getElementById('chat-subtitle');
      const statusPill = document.getElementById('status-pill');
      const messageInput = document.getElementById('message-input');
      const sendButton = document.getElementById('send-button');
      const quickAction = document.getElementById('quick-action');
      const feedback = document.getElementById('chat-feedback');

      let activeThread = 'support';

      function formatTime(date = new Date()) {
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        return `${hours}:${minutes}`;
      }

      function renderThread(threadId) {
        const thread = threads[threadId];
        title.textContent = thread.title;
        subtitle.textContent = thread.subtitle;
        statusPill.textContent = thread.statusText;

        threadButtons.forEach((btn) => {
          btn.classList.toggle('is-active', btn.dataset.thread === threadId);
        });

        stream.innerHTML = '';
        for (const msg of thread.messages) {
          const msgNode = document.createElement('article');
          const isYou = msg.from === 'agent';
          msgNode.className = `message ${isYou ? 'from-you' : 'from-other'}`;
          msgNode.innerHTML = `
            <p class="sender">${isYou ? 'You' : msg.name}</p>
            <p class="text">${escapeHtml(msg.text)}</p>
            <footer>
              <time>${msg.time}</time>
              <span>${isYou ? (msg.read ? 'Read' : 'Delivered') : 'From message center'}</span>
            </footer>
          `;
          stream.append(msgNode);
        }

        const focusable = stream.querySelector('.message:last-child');
        if (focusable) {
          focusable.focus({ preventScroll: false });
        }
        stream.scrollTop = stream.scrollHeight;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function sendMessage() {
        const raw = messageInput.value.trim();
        if (!raw) {
          feedback.textContent = 'Type a message before sending.';
          messageInput.focus();
          return;
        }

        const thread = threads[activeThread];
        const newMessage = {
          id: `${activeThread}-${thread.messages.length + 1}-${Date.now()}`,
          from: 'agent',
          name: 'You',
          text: raw,
          time: formatTime(),
          read: true,
        };

        thread.messages.push(newMessage);
        messageInput.value = '';
        feedback.textContent = 'Message sent.';
        renderThread(activeThread);
      }

      sendButton.addEventListener('click', sendMessage);
      messageInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      quickAction.addEventListener('click', () => {
        const current = messageInput.value.trim();
        const replyTemplates = [
          'Thanks for the update!',
          'Could you share one screenshot?',
          'I can do that now.',
          'Perfect, I\'ll review it today.',
        ];

        const nextIndex =
          replyTemplates.findIndex((template) => !current.toLowerCase().includes(template.toLowerCase()));
        const chosen = nextIndex === -1 ? replyTemplates[0] : replyTemplates[nextIndex];

        messageInput.value = current ? `${current} ${chosen}` : chosen;
        messageInput.focus();
      });

      for (const btn of threadButtons) {
        btn.addEventListener('click', () => {
          activeThread = btn.dataset.thread;
          renderThread(activeThread);
        });
      }

      renderThread(activeThread);
    </script>
  </body>
</html>
